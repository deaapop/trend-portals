# Trend Portals - GitHub Pages (Jekyll + minima) site configuration.
# Generated from trend_localizer/site_template by trend_localizer/deploy_pages.ps1.
title: Trend Portals
description: AI-localized trend summaries in Brazilian Portuguese and Indonesian, with sources cited.
url: "https://deaapop.github.io"
baseurl: "/trend-portals"
theme: minima
lang: en
markdown: kramdown

# Articles are written by trend_localizer as _posts/YYYY-MM-DD-slug.md with their own permalink.
# feed.xml and sitemap.xml are generated by `trend_localizer.main syndicate`, so no feed/sitemap plugins.
plugins: []

exclude:
  - README.md
  - .gitignore
